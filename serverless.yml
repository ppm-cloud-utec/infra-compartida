service: infra-compartida

# Se usa la v3 a proposito: la v4 exige una cuenta de serverless.com y un
# SERVERLESS_ACCESS_KEY para cada deploy. La v3 solo necesita credenciales
# de AWS, que es lo unico que da el Learner Lab.
frameworkVersion: "3"

# Este stack crea TODO lo compartido y lo exporta por Outputs.
# Tiene que desplegarse PRIMERO: los otros 6 microservicios lo importan con
# ${cf:infra-compartida-dev.<Output>}.

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, "dev"}
  memorySize: 256
  timeout: 10
  architecture: x86_64
  # AWS Academy no permite crear roles IAM: hay que reusar LabRole.
  # En una cuenta propia, borra esta linea y descomenta el bloque iam de abajo.
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  environment:
    JWT_SECRET: ${ssm:/ppm/jwt-secret}

package:
  patterns:
    - "!**"
    - "src/**"

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    # true, no "non-linux": en Linux "non-linux" NO usa Docker y busca un
    # binario python3.12 local, que no existe (el sistema trae 3.14).
    # Forzar Docker ademas garantiza que psycopg se compile contra Amazon
    # Linux, que es donde corre la Lambda.
    dockerizePip: true
    slim: true
    # Cache propio por repo. El cache global de ~/.cache lo comparten todos
    # los servicios, y si dos despliegues corren a la vez un contenedor lo
    # deja en root:root mientras el otro lo lee -> EACCES.
    cacheLocation: ./.serverless-cache

functions:
  # Authorizer compartido por los 6 microservicios. Valida el JWT y entrega
  # tenant_id / usuario_id / rol a la Lambda destino por el requestContext.
  autorizador:
    handler: src/handlers/autorizador.manejar
    name: ppm-autorizador-${sls:stage}

resources:
  Resources:

    # ---------- EDA: un topic de dominio ----------
    SnsEventos:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ppm-eventos-${sls:stage}

    SnsAlertas:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ppm-alertas-${sls:stage}

    # ---------- Idempotencia de los workers ----------
    # SQS entrega at-least-once. Sin esta tabla, un evento repetido infla el
    # avance y la ejecucion presupuestal.
    TablaEventosProcesados:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ppm-eventos-procesados-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: evento_id
            AttributeType: S
        KeySchema:
          - AttributeName: evento_id
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    # ---------- S3 ----------
    BucketDatalake:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ppm-datalake-${aws:accountId}-${sls:stage}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    BucketAdjuntos:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ppm-adjuntos-${aws:accountId}-${sls:stage}
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [GET, PUT, POST]
              AllowedOrigins: ["*"]
              AllowedHeaders: ["*"]
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    # ---------- RDS unico (patron Single Database, Multiple Schemas) ----------
    # Decision documentada en docs/convenciones.md: PubliclyAccessible y las
    # Lambdas FUERA de la VPC. Una Lambda dentro de una VPC pierde salida a
    # SNS/S3/DynamoDB salvo con NAT Gateway o VPC Endpoints, y los 3 MS con RDS
    # tambien publican a SNS.
    SgRds:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Acceso a PostgreSQL del proyecto PPM
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
            CidrIp: 0.0.0.0/0

    Rds:
      Type: AWS::RDS::DBInstance
      DeletionPolicy: Delete
      Properties:
        DBInstanceIdentifier: ppm-rds-${sls:stage}
        Engine: postgres
        # 16.15: la 16.4 ya no la ofrece AWS. Las versiones disponibles se
        # consultan con:
        #   aws rds describe-orderable-db-instance-options --engine postgres \
        #     --db-instance-class db.t3.micro --query '*[].EngineVersion'
        EngineVersion: "16.15"
        DBInstanceClass: db.t3.micro
        AllocatedStorage: "20"
        StorageType: gp2
        MasterUsername: ${ssm:/ppm/rds/master-user}
        MasterUserPassword: ${ssm:/ppm/rds/master-password}
        PubliclyAccessible: true
        VPCSecurityGroups:
          - !GetAtt SgRds.GroupId
        BackupRetentionPeriod: 0
        MultiAZ: false
        DeletionProtection: false

  Outputs:
    SnsEventosArn:
      Value: !Ref SnsEventos
      Export:
        Name: ppm-sns-eventos-${sls:stage}
    SnsAlertasArn:
      Value: !Ref SnsAlertas
    TablaEventosProcesados:
      Value: !Ref TablaEventosProcesados
    TablaEventosProcesadosArn:
      Value: !GetAtt TablaEventosProcesados.Arn
    BucketDatalake:
      Value: !Ref BucketDatalake
    BucketDatalakeArn:
      Value: !GetAtt BucketDatalake.Arn
    BucketAdjuntos:
      Value: !Ref BucketAdjuntos
    BucketAdjuntosArn:
      Value: !GetAtt BucketAdjuntos.Arn
    RdsEndpoint:
      Value: !GetAtt Rds.Endpoint.Address
    AutorizadorArn:
      Value: !GetAtt AutorizadorLambdaFunction.Arn
