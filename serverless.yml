service: infra-compartida

frameworkVersion: "3"


provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, "dev"}
  memorySize: 256
  timeout: 10
  architecture: x86_64
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  environment:
    JWT_SECRET_NOMBRE: ppm/jwt-secret

package:
  patterns:
    - "!**"
    - "src/**"

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true
    slim: true
    cacheLocation: ./.serverless-cache

functions:
  autorizador:
    handler: src/handlers/autorizador.manejar
    name: ppm-autorizador-${sls:stage}

  validarTenant:
    handler: src/handlers/tenants.validar
    name: ppm-validar-tenant-${sls:stage}
    description: Valida la peticion de alta antes de crear nada

  publicarTenants:
    handler: src/handlers/tenants.publicar
    name: ppm-publicar-tenants-${sls:stage}
    description: Habilita el tenant escribiendo /ppm/tenants

  retirarTenant:
    handler: src/handlers/tenants.retirar
    name: ppm-retirar-tenant-${sls:stage}
    description: "Rollback: saca el tenant de /ppm/tenants"

resources:
  Resources:

    # ---------- EDA: un topic de dominio ----------
    SnsEventos:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ppm-eventos-${sls:stage}

    SnsAlertas:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ppm-alertas-${sls:stage}

    TablaEventosProcesados:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ppm-eventos-procesados-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: evento_id
            AttributeType: S
        KeySchema:
          - AttributeName: evento_id
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    # ---------- S3 ----------
    BucketDatalake:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ppm-datalake-${aws:accountId}-${sls:stage}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    BucketAdjuntos:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ppm-adjuntos-${aws:accountId}-${sls:stage}
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [GET, PUT, POST]
              AllowedOrigins: ["*"]
              AllowedHeaders: ["*"]
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    SgRds:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Acceso a PostgreSQL del proyecto PPM
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
            CidrIp: 0.0.0.0/0

    Rds:
      Type: AWS::RDS::DBInstance
      DeletionPolicy: Delete
      Properties:
        DBInstanceIdentifier: ppm-rds-${sls:stage}
        Engine: postgres
        EngineVersion: "16.15"
        DBInstanceClass: db.t3.micro
        AllocatedStorage: "20"
        StorageType: gp2
        MasterUsername: ${ssm:/ppm/rds/master-user}
        MasterUserPassword: ${ssm:/ppm/rds/master-password}
        PubliclyAccessible: true
        VPCSecurityGroups:
          - !GetAtt SgRds.GroupId
        BackupRetentionPeriod: 0
        MultiAZ: false
        DeletionProtection: false

    MaquinaAprovisionarTenant:
      Type: AWS::StepFunctions::StateMachine
      Properties:
        StateMachineName: ppm-aprovisionar-tenant-${sls:stage}
        RoleArn: arn:aws:iam::${aws:accountId}:role/LabRole
        DefinitionString: |
          {
            "Comment": "Alta de una organizacion completa. Cada microservicio aprovisiona SU propia base: la maquina solo orquesta y revierte si algo falla.",
            "StartAt": "Validar",
            "States": {
              "Validar": {
                "Type": "Task",
                "Resource": "arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:ppm-validar-tenant-${sls:stage}",
                "Comment": "Rechaza la peticion antes de crear nada a medias.",
                "Retry": [
                  {
                    "ErrorEquals": [
                      "Lambda.ServiceException",
                      "Lambda.AWSLambdaException",
                      "Lambda.SdkClientException",
                      "Lambda.TooManyRequestsException",
                      "States.TaskFailed"
                    ],
                    "IntervalSeconds": 2,
                    "MaxAttempts": 2,
                    "BackoffRate": 2.0
                  }
                ],
                "Next": "Registrar identidad"
              },
              "Registrar identidad": {
                "Type": "Task",
                "Resource": "arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:ms-identidad-${sls:stage}-aprovisionarTenant",
                "Comment": "Registro del tenant y su primer administrador.",
                "ResultPath": "$.identidad",
                "Retry": [
                  {
                    "ErrorEquals": [
                      "Lambda.ServiceException",
                      "Lambda.AWSLambdaException",
                      "Lambda.SdkClientException",
                      "Lambda.TooManyRequestsException",
                      "States.TaskFailed"
                    ],
                    "IntervalSeconds": 2,
                    "MaxAttempts": 2,
                    "BackoffRate": 2.0
                  }
                ],
                "Catch": [
                  {
                    "ErrorEquals": [
                      "States.ALL"
                    ],
                    "ResultPath": "$.error",
                    "Next": "Compensar"
                  }
                ],
                "Next": "Crear schemas"
              },
              "Crear schemas": {
                "Type": "Parallel",
                "Comment": "Las 3 bases SQL en paralelo: no dependen entre si.",
                "Branches": [
                  {
                    "StartAt": "Schema portafolios",
                    "States": {
                      "Schema portafolios": {
                        "Type": "Task",
                        "Resource": "arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:ms-portafolios-${sls:stage}-aprovisionarTenant",
                        "Retry": [
                          {
                            "ErrorEquals": [
                              "Lambda.ServiceException",
                              "Lambda.AWSLambdaException",
                              "Lambda.SdkClientException",
                              "Lambda.TooManyRequestsException",
                              "States.TaskFailed"
                            ],
                            "IntervalSeconds": 2,
                            "MaxAttempts": 2,
                            "BackoffRate": 2.0
                          }
                        ],
                        "End": true
                      }
                    }
                  },
                  {
                    "StartAt": "Schema recursos",
                    "States": {
                      "Schema recursos": {
                        "Type": "Task",
                        "Resource": "arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:ms-recursos-${sls:stage}-aprovisionarTenant",
                        "Retry": [
                          {
                            "ErrorEquals": [
                              "Lambda.ServiceException",
                              "Lambda.AWSLambdaException",
                              "Lambda.SdkClientException",
                              "Lambda.TooManyRequestsException",
                              "States.TaskFailed"
                            ],
                            "IntervalSeconds": 2,
                            "MaxAttempts": 2,
                            "BackoffRate": 2.0
                          }
                        ],
                        "End": true
                      }
                    }
                  },
                  {
                    "StartAt": "Schema presupuestos",
                    "States": {
                      "Schema presupuestos": {
                        "Type": "Task",
                        "Resource": "arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:ms-presupuestos-${sls:stage}-aprovisionarTenant",
                        "Retry": [
                          {
                            "ErrorEquals": [
                              "Lambda.ServiceException",
                              "Lambda.AWSLambdaException",
                              "Lambda.SdkClientException",
                              "Lambda.TooManyRequestsException",
                              "States.TaskFailed"
                            ],
                            "IntervalSeconds": 2,
                            "MaxAttempts": 2,
                            "BackoffRate": 2.0
                          }
                        ],
                        "End": true
                      }
                    }
                  }
                ],
                "ResultPath": "$.schemas",
                "Catch": [
                  {
                    "ErrorEquals": [
                      "States.ALL"
                    ],
                    "ResultPath": "$.error",
                    "Next": "Compensar"
                  }
                ],
                "Next": "Habilitar tenant"
              },
              "Habilitar tenant": {
                "Type": "Task",
                "Resource": "arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:ppm-publicar-tenants-${sls:stage}",
                "Comment": "Se publica AL FINAL: hasta aqui el tenant no recibe trafico.",
                "ResultPath": "$.publicacion",
                "Retry": [
                  {
                    "ErrorEquals": [
                      "Lambda.ServiceException",
                      "Lambda.AWSLambdaException",
                      "Lambda.SdkClientException",
                      "Lambda.TooManyRequestsException",
                      "States.TaskFailed"
                    ],
                    "IntervalSeconds": 2,
                    "MaxAttempts": 2,
                    "BackoffRate": 2.0
                  }
                ],
                "Catch": [
                  {
                    "ErrorEquals": [
                      "States.ALL"
                    ],
                    "ResultPath": "$.error",
                    "Next": "Compensar"
                  }
                ],
                "Next": "Listo"
              },
              "Compensar": {
                "Type": "Parallel",
                "Comment": "Rollback. Deja el sistema como estaba antes del alta.",
                "Branches": [
                  {
                    "StartAt": "Retirar de la lista",
                    "States": {
                      "Retirar de la lista": {
                        "Type": "Task",
                        "Resource": "arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:ppm-retirar-tenant-${sls:stage}",
                        "Retry": [
                          {
                            "ErrorEquals": [
                              "Lambda.ServiceException",
                              "Lambda.AWSLambdaException",
                              "Lambda.SdkClientException",
                              "Lambda.TooManyRequestsException",
                              "States.TaskFailed"
                            ],
                            "IntervalSeconds": 2,
                            "MaxAttempts": 2,
                            "BackoffRate": 2.0
                          }
                        ],
                        "Catch": [
                          {
                            "ErrorEquals": [
                              "States.ALL"
                            ],
                            "Next": "Retirar de la lista sin efecto"
                          }
                        ],
                        "End": true
                      },
                      "Retirar de la lista sin efecto": {
                        "Type": "Pass",
                        "End": true
                      }
                    }
                  },
                  {
                    "StartAt": "Borrar identidad",
                    "States": {
                      "Borrar identidad": {
                        "Type": "Task",
                        "Resource": "arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:ms-identidad-${sls:stage}-compensarTenant",
                        "Retry": [
                          {
                            "ErrorEquals": [
                              "Lambda.ServiceException",
                              "Lambda.AWSLambdaException",
                              "Lambda.SdkClientException",
                              "Lambda.TooManyRequestsException",
                              "States.TaskFailed"
                            ],
                            "IntervalSeconds": 2,
                            "MaxAttempts": 2,
                            "BackoffRate": 2.0
                          }
                        ],
                        "Catch": [
                          {
                            "ErrorEquals": [
                              "States.ALL"
                            ],
                            "Next": "Borrar identidad sin efecto"
                          }
                        ],
                        "End": true
                      },
                      "Borrar identidad sin efecto": {
                        "Type": "Pass",
                        "End": true
                      }
                    }
                  },
                  {
                    "StartAt": "Borrar schema portafolios",
                    "States": {
                      "Borrar schema portafolios": {
                        "Type": "Task",
                        "Resource": "arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:ms-portafolios-${sls:stage}-compensarTenant",
                        "Retry": [
                          {
                            "ErrorEquals": [
                              "Lambda.ServiceException",
                              "Lambda.AWSLambdaException",
                              "Lambda.SdkClientException",
                              "Lambda.TooManyRequestsException",
                              "States.TaskFailed"
                            ],
                            "IntervalSeconds": 2,
                            "MaxAttempts": 2,
                            "BackoffRate": 2.0
                          }
                        ],
                        "Catch": [
                          {
                            "ErrorEquals": [
                              "States.ALL"
                            ],
                            "Next": "Borrar schema portafolios sin efecto"
                          }
                        ],
                        "End": true
                      },
                      "Borrar schema portafolios sin efecto": {
                        "Type": "Pass",
                        "End": true
                      }
                    }
                  },
                  {
                    "StartAt": "Borrar schema recursos",
                    "States": {
                      "Borrar schema recursos": {
                        "Type": "Task",
                        "Resource": "arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:ms-recursos-${sls:stage}-compensarTenant",
                        "Retry": [
                          {
                            "ErrorEquals": [
                              "Lambda.ServiceException",
                              "Lambda.AWSLambdaException",
                              "Lambda.SdkClientException",
                              "Lambda.TooManyRequestsException",
                              "States.TaskFailed"
                            ],
                            "IntervalSeconds": 2,
                            "MaxAttempts": 2,
                            "BackoffRate": 2.0
                          }
                        ],
                        "Catch": [
                          {
                            "ErrorEquals": [
                              "States.ALL"
                            ],
                            "Next": "Borrar schema recursos sin efecto"
                          }
                        ],
                        "End": true
                      },
                      "Borrar schema recursos sin efecto": {
                        "Type": "Pass",
                        "End": true
                      }
                    }
                  },
                  {
                    "StartAt": "Borrar schema presupuestos",
                    "States": {
                      "Borrar schema presupuestos": {
                        "Type": "Task",
                        "Resource": "arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:ms-presupuestos-${sls:stage}-compensarTenant",
                        "Retry": [
                          {
                            "ErrorEquals": [
                              "Lambda.ServiceException",
                              "Lambda.AWSLambdaException",
                              "Lambda.SdkClientException",
                              "Lambda.TooManyRequestsException",
                              "States.TaskFailed"
                            ],
                            "IntervalSeconds": 2,
                            "MaxAttempts": 2,
                            "BackoffRate": 2.0
                          }
                        ],
                        "Catch": [
                          {
                            "ErrorEquals": [
                              "States.ALL"
                            ],
                            "Next": "Borrar schema presupuestos sin efecto"
                          }
                        ],
                        "End": true
                      },
                      "Borrar schema presupuestos sin efecto": {
                        "Type": "Pass",
                        "End": true
                      }
                    }
                  }
                ],
                "ResultPath": "$.compensacion",
                "Next": "Fallo"
              },
              "Listo": {
                "Type": "Succeed"
              },
              "Fallo": {
                "Type": "Fail",
                "Error": "AltaDeTenantFallida",
                "Cause": "Ver $.error. El rollback ya corrio."
              }
            }
          }

    ApiPpm:
      Type: AWS::ApiGateway::RestApi
      Properties:
        Name: ppm-api-${sls:stage}
        Description: Entrada unica de los 6 microservicios del PPM
        EndpointConfiguration:
          Types: [REGIONAL]

    AutorizadorApi:
      Type: AWS::ApiGateway::Authorizer
      Properties:
        Name: autorizadorCompartido
        RestApiId: !Ref ApiPpm
        Type: REQUEST
        IdentitySource: method.request.header.Authorization
        AuthorizerResultTtlInSeconds: 300
        AuthorizerUri:
          Fn::Join:
            - ""
            - - "arn:aws:apigateway:${aws:region}:lambda:path/2015-03-31/functions/"
              - !GetAtt AutorizadorLambdaFunction.Arn
              - "/invocations"

    PermisoAutorizador:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt AutorizadorLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: apigateway.amazonaws.com
        SourceArn:
          Fn::Join:
            - ""
            - - "arn:aws:execute-api:${aws:region}:${aws:accountId}:"
              - !Ref ApiPpm
              - "/authorizers/"
              - !Ref AutorizadorApi

    Cors401:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiPpm
        ResponseType: UNAUTHORIZED
        StatusCode: "401"
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

    Cors403:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiPpm
        ResponseType: ACCESS_DENIED
        StatusCode: "403"
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

    Cors4xx:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiPpm
        ResponseType: DEFAULT_4XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

    Cors5xx:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiPpm
        ResponseType: DEFAULT_5XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"


    BaseGlue:
      Type: AWS::Glue::Database
      Properties:
        CatalogId: !Ref AWS::AccountId
        DatabaseInput:
          Name: ppm_datalake_${sls:stage}
          Description: Eventos de dominio de la plataforma PPM

    TablaEventosGlue:
      Type: AWS::Glue::Table
      Properties:
        CatalogId: !Ref AWS::AccountId
        DatabaseName: !Ref BaseGlue
        TableInput:
          Name: eventos
          TableType: EXTERNAL_TABLE
          Parameters:
            classification: json
            projection.enabled: "true"
            projection.tenant_id.type: injected
            projection.fecha.type: date
            projection.fecha.format: yyyy-MM-dd
            projection.fecha.range: 2025-01-01,NOW
            projection.tipo.type: enum
            projection.tipo.values: gasto.registrado,presupuesto.excedido,proyecto.creado,proyecto.priorizado,recurso.asignado,recurso.sobreasignado,tarea.completada,tarea.creada
            storage.location.template:
              Fn::Join:
                - ""
                - - "s3://"
                  - !Ref BucketDatalake
                  - "/eventos/tenant_id=$"
                  - "{tenant_id}/fecha=$"
                  - "{fecha}/tipo=$"
                  - "{tipo}/"
          PartitionKeys:
            - { Name: tenant_id, Type: string }
            - { Name: fecha, Type: string }
            - { Name: tipo, Type: string }
          StorageDescriptor:
            Location:
              Fn::Join: ["", ["s3://", !Ref BucketDatalake, "/eventos/"]]
            InputFormat: org.apache.hadoop.mapred.TextInputFormat
            OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
            SerdeInfo:
              SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
              Parameters:
                ignore.malformed.json: "true"
            Columns:
              - { Name: evento_id, Type: string }
              - { Name: origen, Type: string }
              - { Name: ocurrido_en, Type: string }
              - { Name: version, Type: int }
              - { Name: proyecto_id, Type: string }
              - { Name: tarea_id, Type: string }
              - { Name: avance_pct, Type: double }
              - { Name: monto, Type: double }
              - { Name: total_gastado, Type: double }
              - { Name: monto_aprobado, Type: double }
              - { Name: ejecutado_pct, Type: double }
              - { Name: recurso_id, Type: string }
              - { Name: horas_semana, Type: double }
              - { Name: ocupacion_pct, Type: double }

    GrupoAthena:
      Type: AWS::Athena::WorkGroup
      Properties:
        Name: ppm-analitica-${sls:stage}
        Description: Consultas SQL sobre el data lake de eventos
        RecursiveDeleteOption: true
        WorkGroupConfiguration:
          EnforceWorkGroupConfiguration: true
          # Tope por consulta: Athena cobra por byte escaneado.
          BytesScannedCutoffPerQuery: 1073741824
          ResultConfiguration:
            OutputLocation:
              Fn::Join: ["", ["s3://", !Ref BucketDatalake, "/athena-resultados/"]]


    AlarmaDlqPortafolios:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ppm-dlq-portafolios-${sls:stage}
        AlarmDescription: Un evento de la cola portafolios fallo 3 veces y quedo en su DLQ
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: ppm-cola-portafolios-dlq-${sls:stage}
        Statistic: Maximum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref SnsAlertas

    AlarmaDlqPresupuestos:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ppm-dlq-presupuestos-${sls:stage}
        AlarmDescription: Un evento de la cola presupuestos fallo 3 veces y quedo en su DLQ
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: ppm-cola-presupuestos-dlq-${sls:stage}
        Statistic: Maximum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref SnsAlertas

    AlarmaDlqAnalitico:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ppm-dlq-analitico-${sls:stage}
        AlarmDescription: Un evento de la cola analitico fallo 3 veces y quedo en su DLQ
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: ppm-cola-analitico-dlq-${sls:stage}
        Statistic: Maximum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref SnsAlertas

    AlarmaDlqAlertas:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ppm-dlq-alertas-${sls:stage}
        AlarmDescription: Un evento de la cola alertas fallo 3 veces y quedo en su DLQ
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: ppm-cola-alertas-dlq-${sls:stage}
        Statistic: Maximum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref SnsAlertas

    TableroCloudWatch:
      Type: AWS::CloudWatch::Dashboard
      Properties:
        DashboardName: ppm-plataforma-${sls:stage}
        DashboardBody:
          Fn::Sub:
            - |
              {"widgets":[
               {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"API Gateway: peticiones y errores","region":"${AWS::Region}","stat":"Sum","period":300,
                "metrics":[["AWS/ApiGateway","Count","ApiName","ppm-api-${Stage}"],[".","4XXError",".","."],[".","5XXError",".","."]]}},
               {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"API Gateway: latencia (ms)","region":"${AWS::Region}","period":300,
                "metrics":[["AWS/ApiGateway","Latency","ApiName","ppm-api-${Stage}",{"stat":"Average"}],["...",{"stat":"p90"}]]}},
               {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Lambda: invocaciones y errores (todas)","region":"${AWS::Region}","stat":"Sum","period":300,
                "metrics":[["AWS/Lambda","Invocations"],[".","Errors"],[".","Throttles"]]}},
               {"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{"title":"SNS ppm-eventos: eventos publicados","region":"${AWS::Region}","stat":"Sum","period":300,
                "metrics":[["AWS/SNS","NumberOfMessagesPublished","TopicName","ppm-eventos-${Stage}"]]}},
               {"type":"metric","x":0,"y":12,"width":12,"height":6,"properties":{"title":"SQS: mensajes pendientes por cola","region":"${AWS::Region}","stat":"Maximum","period":300,
                "metrics":[["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","ppm-cola-portafolios-${Stage}"],["...","ppm-cola-presupuestos-${Stage}"],["...","ppm-cola-analitico-${Stage}"],["...","ppm-cola-alertas-${Stage}"]]}},
               {"type":"metric","x":12,"y":12,"width":12,"height":6,"properties":{"title":"DLQ: eventos fallidos (deberia ser 0)","region":"${AWS::Region}","stat":"Maximum","period":300,
                "metrics":[["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","ppm-cola-portafolios-dlq-${Stage}"],["...","ppm-cola-presupuestos-dlq-${Stage}"],["...","ppm-cola-analitico-dlq-${Stage}"],["...","ppm-cola-alertas-dlq-${Stage}"]]}},
               {"type":"metric","x":0,"y":18,"width":24,"height":6,"properties":{"title":"Step Functions: altas de organizaciones","region":"${AWS::Region}","stat":"Sum","period":3600,
                "metrics":[["AWS/States","ExecutionsSucceeded","StateMachineArn","${Maquina}"],[".","ExecutionsFailed",".","."]]}}
              ]}
            - Stage: ${sls:stage}
              Maquina: !Ref MaquinaAprovisionarTenant

  Outputs:
    ApiId:
      Description: API Gateway unica que comparten los 6 microservicios
      Value: !Ref ApiPpm
    ApiRootResourceId:
      Description: Recurso raiz de la API, del que cuelga el prefijo de cada servicio
      Value: !GetAtt ApiPpm.RootResourceId
    AutorizadorApiId:
      Description: Authorizer registrado una sola vez sobre la API compartida
      Value: !Ref AutorizadorApi
    ApiUrl:
      Description: URL base. Cada servicio vive en ApiUrl/<servicio>
      Value:
        Fn::Join:
          - ""
          - - "https://"
            - !Ref ApiPpm
            - ".execute-api.${aws:region}.amazonaws.com/${sls:stage}"

    MaquinaAprovisionarTenantArn:
      Description: Maquina de estados que da de alta una organizacion
      Value: !Ref MaquinaAprovisionarTenant

    SnsEventosArn:
      Value: !Ref SnsEventos
      Export:
        Name: ppm-sns-eventos-${sls:stage}
    SnsAlertasArn:
      Value: !Ref SnsAlertas
    TablaEventosProcesados:
      Value: !Ref TablaEventosProcesados
    TablaEventosProcesadosArn:
      Value: !GetAtt TablaEventosProcesados.Arn
    BucketDatalake:
      Value: !Ref BucketDatalake
    BucketDatalakeArn:
      Value: !GetAtt BucketDatalake.Arn
    BucketAdjuntos:
      Value: !Ref BucketAdjuntos
    BucketAdjuntosArn:
      Value: !GetAtt BucketAdjuntos.Arn
    RdsEndpoint:
      Value: !GetAtt Rds.Endpoint.Address
    AutorizadorArn:
      Value: !GetAtt AutorizadorLambdaFunction.Arn
    GrupoAthena:
      Description: Workgroup para consultar el data lake con SQL
      Value: !Ref GrupoAthena
    BaseGlue:
      Value: !Ref BaseGlue
